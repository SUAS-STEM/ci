      - name: Install pinned age crypto
        shell: pwsh
        run: python tools/install_age.py
      - name: Compile decrypted synthetic source and return encrypted output
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NONCE: cc33530137b5f3997b9aaabe
          CI_PRIVATE_SHA: 6fd6b641a19357b1b6d9b8b9122f3eeeb5e44baa
          CI_OUTPUT_RECIPIENT: age1v0t6mc4hlw6vfk9wezytlqmrpkalmp7q2e00f2efx5gw40agnpksxx08f8
