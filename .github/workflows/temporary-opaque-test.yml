name: Temporary encrypted Windows MSVC synthetic integration
run-name: opaque-ac2dbb364a0e32468ee7ea98
on:
  push:
    branches: [security/signed-artifact-provenance]
permissions:
  contents: read
jobs:
  opaque-windows-msvc:
    if: github.repository == 'SUAS-STEM/ci-relay-lab' && github.ref == 'refs/heads/security/signed-artifact-provenance' && github.actor == 'eschan145' && github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout vetted public relay code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public-only source guard
        shell: pwsh
        run: python -m tools.public_guard --tree-only
      - name: Install pinned age crypto
        shell: pwsh
        run: python tools/install_age.py
      - name: Compile decrypted synthetic source and return encrypted output
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NONCE: ac2dbb364a0e32468ee7ea98
          CI_PRIVATE_SHA: aaac5f4cc6f7ebc241376a86dc70b0afb96cfff4
          CI_OUTPUT_RECIPIENT: age1c2c0zyh3kwmmkclv79atudg66q9qvelvawgsg92c3wsv5da97fcqhlmvmc
        run: python -m tools.opaque_runner
