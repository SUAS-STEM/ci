name: Temporary GitHub OIDC encrypted-recipient test
run-name: opaque-016f4381df97f8b106b2f6bb
on:
  push:
    branches: [security/signed-artifact-provenance]
permissions:
  contents: read
jobs:
  verify-ephemeral-recipient:
    if: github.repository == 'SUAS-STEM/ci-relay-lab' && github.ref == 'refs/heads/security/signed-artifact-provenance' && github.actor == 'eschan145'
    runs-on: windows-2022
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout PUBLIC OIDC helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify public-only source guard
        shell: pwsh
        run: python -m tools.public_guard --tree-only
      - name: Install pinned encryption tools
        shell: pwsh
        run: python tools/install_age.py
      - name: Prove GitHub-signed ephemeral key without sending source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NONCE: 016f4381df97f8b106b2f6bb
          CI_PRIVATE_SHA: 64c21b09e9bcd9ab9cfed65501cbaeb13af31581
          CI_OUTPUT_RECIPIENT: age1rtc4nnhleamdqf0ee4vqs923efsag3wcs0pvcnmh0fyafuzf0arssrtad5
        run: |
          @'
          import os
          from pathlib import Path
          import re
          import subprocess
          from tools.opaque_runner import KEYGEN, PUBLIC_REPO, github_runner_oidc, oidc_audience
          nonce = os.environ['CI_NONCE']
          source_sha = os.environ['CI_PRIVATE_SHA']
          return_recipient = os.environ['CI_OUTPUT_RECIPIENT']
          folder = Path(os.environ['RUNNER_TEMP']) / ('oidc-proof-' + nonce)
          folder.mkdir()
          keyfile = folder / 'ephemeral-worker-identity'
          generated = subprocess.run([str(KEYGEN), '-o', str(keyfile)],
                                     check=True, capture_output=True, text=True, timeout=30)
          worker_recipient = re.search(r'age1[023456789acdefghjklmnpqrstuvwxyz]{58}', generated.stderr).group()
          recipient_path = folder / 'recipient.agepub'
          recipient_path.write_text(worker_recipient + '\n', encoding='ascii')
          proof_path = folder / 'recipient.oidc'
          proof_path.write_text(github_runner_oidc(oidc_audience(
              nonce, source_sha, return_recipient, worker_recipient)) + '\n',
              encoding='ascii')
          subprocess.run(['gh', 'release', 'upload', 'ci-opaque-' + nonce, '--repo',
                          PUBLIC_REPO, str(recipient_path), str(proof_path)],
                         check=True, capture_output=True, timeout=80)
          print('GITHUB_OIDC_EPHEMERAL_RECIPIENT_UPLOADED_WITHOUT_SOURCE')
          '@ | python -
