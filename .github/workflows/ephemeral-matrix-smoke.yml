name: Temporary ephemeral encryption matrix test

on:
  push:
    branches: [security/signed-artifact-provenance]

permissions:
  contents: read

jobs:
  synthetic-matrix:
    name: ephemeral-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout public fixture only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public fixture source safety check
        run: python -m tools.public_guard --tree-only
      - name: Install verified age binary
        run: python tools/install_age.py
      - name: Test all regression checks
        run: python -m unittest discover -s tests -v
      - name: Test synthetic ephemeral encryption and build
        run: python -m tools.ephemeral_branch_smoke
