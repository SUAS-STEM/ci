name: Synthetic cross-platform CI
run-name: fixture-${{ inputs.trace_id }}

on:
  workflow_dispatch:
    inputs:
      trace_id:
        description: Non-sensitive test identifier (alphanumeric and hyphens)
        required: true
        type: string
      left:
        description: Synthetic left operand
        required: true
        type: string
      right:
        description: Synthetic right operand
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout public synthetic project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run fixture validation unit tests
        run: python -m unittest discover -s tests -v
      - name: Configure public C++ sample
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build public C++ sample
        run: cmake --build build --config Release --parallel 2
      - name: CTest public C++ sample
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify synthetic dispatch inputs against binary
        env:
          TRACE_ID: ${{ inputs.trace_id }}
          LEFT: ${{ inputs.left }}
          RIGHT: ${{ inputs.right }}
        run: python -m tools.check_fixture
