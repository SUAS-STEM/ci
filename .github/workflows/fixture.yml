name: Synthetic cross-platform CI
run-name: fixture-${{ inputs.trace_id }}

on:
  workflow_dispatch:
    inputs:
      trace_id:
        description: Non-sensitive test identifier (alphanumeric and hyphens)
        required: true
        type: string
      left:
        description: Synthetic left operand
        required: true
        type: string
      right:
        description: Synthetic right operand
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout public synthetic project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install checksum-verified age encryption utility
        run: python tools/install_age.py
      - name: Capture and encrypt all synthetic build/test output
        env:
          TRACE_ID: ${{ inputs.trace_id }}
          LEFT: ${{ inputs.left }}
          RIGHT: ${{ inputs.right }}
        run: python -m tools.run_encrypted_fixture
      - name: Upload ciphertext only (never plaintext)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-diagnostics-${{ matrix.os }}
          path: encrypted-log.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
