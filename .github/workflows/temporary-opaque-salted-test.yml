name: Temporary encrypted Windows MSVC synthetic integration
run-name: opaque-c699ea04796529440ee6b2b4
on:
  push:
    branches: [security/signed-artifact-provenance]
permissions:
  contents: read
jobs:
  opaque-windows-msvc:
    if: github.repository == 'SUAS-STEM/ci-relay-lab' && github.ref == 'refs/heads/security/signed-artifact-provenance' && github.actor == 'eschan145' && github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      CI_NONCE: c699ea04796529440ee6b2b4
      CI_PRIVATE_SHA: 88db19eccbd4c2de75265bbc2aec187bf4052fc5
      CI_OUTPUT_RECIPIENT: age1jwtjt60yd044gcu0cgklreelkckusxhnk452cx4rpt6uhxe6j58semwxgv
      CI_BUNDLE_SHA256: 5a4ed2fac5cafb6231b27b2db337c21dd24a5eb9fdfedb9babee5b52e93ec0a8
    steps:
      - name: Checkout vetted public relay code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public-only source guard
        shell: pwsh
        run: python -m tools.public_guard --tree-only
      - name: Install pinned age crypto
        shell: pwsh
        run: python tools/install_age.py
