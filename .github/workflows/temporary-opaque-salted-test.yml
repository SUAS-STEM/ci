name: Temporary encrypted Windows MSVC synthetic integration
run-name: opaque-d8c543fe13e02aa602d66196
on:
  push:
    branches: [security/signed-artifact-provenance]
permissions:
  contents: read
jobs:
  opaque-windows-msvc:
    if: github.repository == 'SUAS-STEM/ci-relay-lab' && github.ref == 'refs/heads/security/signed-artifact-provenance' && github.actor == 'eschan145' && github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      CI_NONCE: d8c543fe13e02aa602d66196
      CI_PRIVATE_SHA: 7a4d8d5c088d34944498e3bfb3b9c2037b3e5c6a
      CI_OUTPUT_RECIPIENT: age14th5hpv54vytpflcsuznr5mg3jct6xks0efyu5mpzgg2fdql9d9qrcwa5w
      CI_BUNDLE_SHA256: 7f59907f0c30c905546f6bac3defa9a94b2ed5dd314507c21074a30af0155bca
    steps:
      - name: Checkout vetted public relay code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public-only source guard
        shell: pwsh
        run: python -m tools.public_guard --tree-only
      - name: Install pinned age crypto
        shell: pwsh
        run: python tools/install_age.py
      - name: Publish GitHub-signed per-run recipient using public token
        shell: pwsh
