name: Temporary encrypted Windows MSVC synthetic integration
run-name: opaque-f83abf9faee17af6807d18ef
on:
  push:
    branches: [security/signed-artifact-provenance]
permissions:
  contents: read
jobs:
  opaque-windows-msvc:
    if: github.repository == 'SUAS-STEM/ci-relay-lab' && github.ref == 'refs/heads/security/signed-artifact-provenance' && github.actor == 'eschan145' && github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      CI_NONCE: f83abf9faee17af6807d18ef
      CI_PRIVATE_SHA: 2ed2e280aefe680126db8de1090e5d7b88860d3d
      CI_OUTPUT_RECIPIENT: age19ernkdpwvzp6qee6834ns469c3suh3hvudd6dsp2flmp089jy4kqvmpyx8
      CI_BUNDLE_SHA256: 98fec410e27992ae7c2023aa69b585af227c0c98c3b03566c7b92c39fe6450bc
    steps:
      - name: Checkout vetted public relay code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public-only source guard
        shell: pwsh
        run: python -m tools.public_guard --tree-only
      - name: Install pinned age crypto
        shell: pwsh
        run: python tools/install_age.py
      - name: Publish GitHub-signed per-run recipient using public token
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.opaque_staged_runner bootstrap
      - name: Compile decrypted synthetic source without repository token
        shell: pwsh
        env:
          # The trusted Python transport uses this PUBLIC-only credential to
          # upload encrypted progress chunks. It strips it from PowerShell.
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.opaque_staged_runner compile
      - name: Return only encrypted output with signed status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.opaque_staged_runner publish
